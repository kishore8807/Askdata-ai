# docker compose up -d --build
# first run:   docker compose run --rm backend python -m backend.scripts.init_db --seed
#              docker compose run --rm backend python -m backend.scripts.bootstrap_users
# with local AI in Docker too:   docker compose --profile ollama up -d   (then: docker compose exec ollama ollama pull qwen2.5:3b)

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_database}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql          # PostgreSQL 18 image layout
    ports:
      - "127.0.0.1:5432:5432"               # local access only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL_DOCKER:-http://host.docker.internal:11434}
      TRUSTED_PROXIES: "*"                  # the API is only reachable from the front door on the private network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  frontend:
    build: .
    restart: unless-stopped
    command: ["gunicorn", "-w", "2", "--timeout", "150", "-b", "0.0.0.0:5000", "frontend.app:app"]
    env_file: .env
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "5000:5000"

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

volumes:
  pgdata:
  ollama:
